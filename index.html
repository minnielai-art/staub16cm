73c;display:block;font-size:1.05em}.step p{margin:5px 0 0}.note{background:#eef3ec;border-left:4px solid #547c5c;padding:15px 18px;border-radius:8px;margin-top:23px}.footer{font-size:.72em;color:#758178;margin-top:20px}.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:25px}.bottom button{border:1px solid #cbd7cc;border-radius:9px;background:#fff;padding:10px 16px;font-size:16px;cursor:pointer}@media(max-width:700px){.layout{display:block;padding:10px}.nav{position:static;display:flex;flex-direction:row;overflow-x:auto;padding-bottom:12px}.nav button{min-width:175px}.content{padding:18px}.hero{max-height:245px}header{padding:16px}.toolbar{gap:7px}}@media print{header .toolbar,.nav,.bottom{display:none}.layout{display:block;padding:0}.main{box-shadow:none}.hero{max-height:250px}body{background:white}}
.mobile-recipe-picker{display:none;background:#fff;border:1px solid #dfe6dc;border-radius:14px;padding:13px 15px;margin:0 0 12px}.mobile-recipe-picker label{display:block;font-size:14px;font-weight:700;color:#315841;margin-bottom:7px}.mobile-recipe-picker select{display:block;width:100%;min-height:48px;border:1px solid #9cad9e;border-radius:10px;background:#fff;color:#24382c;font-size:17px;padding:10px 12px;font-family:inherit}@media(max-width:700px){.mobile-recipe-picker{display:block}.nav{display:none}.layout{padding:10px}.content h2{font-size:1.3em}}@media print{.mobile-recipe-picker{display:none!important}}</style></head><body><header><h1>Staub 16 cm｜清爽一人料理</h1><p>6 道乾爽、少油、少醬汁食譜 · 可調整字體 · 可勾選備料與步驟</p><div class="toolbar"><span style="font-size:15px">字體大小</span><button data-size="16">小</button><button data-size="19" aria-pressed="true">中</button><button data-size="23">大</button><button data-size="28">特大</button><button id="print">列印食譜</button></div></header><div class="layout"><div class="mobile-recipe-picker"><label for="recipe-select">選擇料理</label><select id="recipe-select" aria-label="選擇要閱讀的食譜"></select></div><nav class="nav" id="nav"></nav><main class="main" id="main"></main></div><script>const recipes=[{"name": "香煎雞腿佐蘆筍菇菇", "time": "20–25 分鐘", "desc": "乾爽・外香內嫩", "ingredients": ["帶皮去骨雞腿排 120–150g", "蘆筍 4 根", "蘑菇 3 朵", "橄欖油 1/2 小匙", "鹽約 1/8 小匙、黑胡椒少許", "蒜頭 1 瓣（可省略）"], "steps": [["擦乾雞肉", "用紙巾將雞腿排兩面、尤其雞皮擦乾；如果肉厚薄不均，可稍微攤平。兩面撒鹽與黑胡椒，靜置 3 分鐘。"], ["處理蔬菜", "蘆筍洗淨、折除較硬根部，切成 2–3 段；蘑菇擦乾切厚片。蔬菜表面越乾，越不容易出水。"], ["小火預熱", "Staub 以小火慢慢預熱約 2–3 分鐘，加入半小匙油並均勻抹開。不要以大火空燒琺瑯鍋。"], ["煎出金黃雞皮", "雞皮朝下放入，輕壓 10 秒讓表面貼鍋，以中小火煎約 6–8 分鐘。未形成焦香前不要頻繁翻動。"], ["翻面煎熟", "翻面後轉小火續煎約 5–8 分鐘；厚肉可短暫加蓋 1–2 分鐘，之後開蓋散去水氣。最厚處中心達 74°C。"], ["煎蔬菜、盛盤", "雞腿取出靜置 3 分鐘。鍋內保留薄薄一層雞油，先煎蘑菇再放蘆筍，翻煎 3–5 分鐘，撒少許鹽；雞肉切片與蔬菜一起盛盤。"]], "note": "16 cm 鍋底較小，雞腿與蔬菜分開煎最能保持乾爽；不需加水或濃醬。", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUE "}, {"name": "薑香雞肉香菇炊飯", "time": "約 40 分鐘（含浸米）", "desc": "清淡・一鍋主食", "ingredients": ["白米 90ml（半合）", "去骨雞腿肉 80g", "鮮香菇 2 朵", "薑絲 1 小撮", "水約 90–100ml", "醬油 1/2 小匙", "青蔥少許（可省略）"], "steps": [["洗米與浸泡", "白米洗到水略清，浸泡 20–30 分鐘後充分瀝乾。浸泡時間不含在爐上烹調時間內。"], ["切好配料", "雞肉切約 2 公分小塊；香菇切片，薑切細絲。雞肉切小塊較容易在短時間內煮熟。"], ["放入鍋中", "米先鋪平，加入 90–100ml 水與半小匙醬油；將雞肉、香菇、薑絲均勻鋪在米上，先不要攪拌。"], ["加熱至沸騰", "不蓋蓋，以中小火加熱到鍋面明顯冒泡；用鍋鏟輕輕確認鍋底沒有黏米，避免用力刮傷琺瑯。"], ["小火煮飯", "蓋上鍋蓋轉極小火，煮約 10–12 分鐘。不要頻繁掀蓋；若聽到明顯乾燒聲或聞到焦味，立即關火。"], ["關火燜飯", "關火原蓋燜 10–12 分鐘。確認雞肉最厚處達 74°C，米飯熟透後由底部輕輕翻鬆；若米芯偏硬，可補少量熱水再短煮。"]], "note": "水量因米種、浸泡與爐具而變；首次可從 100ml 試起，記錄喜歡的乾爽程度。", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCAIAAgADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD9ApJi0j7v7x/nTDGjexrnpvEib357n+dQ/wDCVop5I/Ovn3VjfU+hVKR0UlsGqjc6YsmTVe38RwzDAYZ+tWv7VjK/eFDlFjUZxMa70UknArNl0WUGumN/GSe9KbpO+K5pQizojUkjkv7HkB6c1NHYPH15ronvIO5FQPd2z8bgKydNI2VVvoZH2Vuwpraezda1jPCBwR+dQPeRKSNwFQ4pDUmzJk03bUAsnVuOK2Wnibq4/Oo2mt+7j86y5UaKTM8RstHztmrzXdsoOWH50z7ZanoR+dOy7hd9ikU9RUL2wfJHFaD3lv8A3lH41Ebu2PBZSfrRyoFJlFLXB604wshyKle4gB+8Pzp6XkGPvD86zcUaKTIt+B81NaYYxUjTwSMQrDP1ppto3Od+KzcX0KUl1GKoY8nFP8tT70NalR8r5pBEyd80uV9UHMujI5bNWBPSs26tVANa7liMZzVG5gZuTmuacexvCT6nK6hYfePSubvkMRPtXcXsRAxjNYV5p5lDHFebOOp6MJaHFT3IRiScYqjJrYDbQ {current===recipes.length-1?'disabled':''}>下一道 →</button></div></div>`;nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.id));document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);main.querySelectorAll('input').forEach(el=>{let k=`staub-${current}-${el.dataset.check}`;el.checked=sessionStorage.getItem(k)==='1';el.onchange=()=>sessionStorage.setItem(k,el.checked?'1':'0')})}function go(i){if(i<0||i>=recipes.length)return;current=i;render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--font',b.dataset.size+'px');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});document.getElementById('print').onclick=()=>window.print();render();</script></body></html>
